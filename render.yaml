services:
  - type: web
    name: nonhuman-lab
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NONHUMAN_DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_DNI
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
