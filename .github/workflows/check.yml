name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nonhuman
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nonhuman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nonhuman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python manage.py test
      - name: Test PostgreSQL
        run: python manage.py test
        env:
          DATABASE_URL: postgresql://nonhuman:ci-only-password@localhost:5432/nonhuman
      - run: python manage.py makemigrations --check --dry-run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test browser on isolated demo database
        run: npx playwright test
        env:
          PYTHON: python
      - name: Build deployment image
        run: docker build --tag nonhuman-lab:check .
