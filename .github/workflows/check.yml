name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nonhuman
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nonhuman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nonhuman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://nonhuman:ci-only-password@localhost:5432/nonhuman_test
      - run: npx playwright install --with-deps chromium
      - name: Test browser on isolated demo database
        run: npm run test:e2e
